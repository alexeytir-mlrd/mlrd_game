/* Общие стили и экраны, которые ещё не переведены на новый дизайн (Венчур, Активы, Магазин, Рейтинг, Профиль,
   модалки, шторка торговли). Цвета и шрифт — токены темы (config/theme.json), чтобы всё читалось на новом фоне.
   Главный экран, меню и кнопка «Завершить день» — src/ui/home.css. */
:root {
  color-scheme: light;
  --bg: var(--color-bg);
  --fg: var(--color-ink);
  --muted: var(--color-mute);
  --card: var(--color-surface);
  --btn: var(--color-gold);
  --btn-fg: var(--color-gold-ink);
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font-ui); }
#app { display: flex; flex-direction: column; height: var(--app-height, 100vh); height: var(--app-height, 100dvh); padding: var(--safe-top, 0px) var(--safe-right, 0px) 0 var(--safe-left, 0px); }
#screen { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
.card { background: var(--card); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.item { border-top: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); padding: 8px 0; }
.item.owned b::after { content: " ✓"; }
.row { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
.row.spread { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.warn { font-weight: 600; margin-top: 6px; }
.big { font-size: 26px; font-weight: 700; }
.center { text-align: center; padding: 12px; }
button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); }
button.primary { background: var(--btn); color: var(--btn-fg); border-color: transparent; }
button.selected { outline: 2px solid var(--fg); }
button:disabled { opacity: 0.5; }
#actionbar:empty { display: none; }
input, select { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); min-width: 0; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 4px 2px; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.cell { border: 1px dashed var(--muted); border-radius: 6px; padding: 6px; font-size: 13px; }
.cell.got { border-style: solid; }
#modal { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--safe-top, 0px)) 16px calc(16px + var(--safe-bottom, 0px)); z-index: 10; }
#modal[hidden] { display: none; }
.modal { background: var(--bg); color: var(--fg); border-radius: 10px; padding: 14px 16px; width: 100%; max-width: 420px; max-height: min(85vh, 100%); overflow-y: auto; }
.modal h3 { margin: 0 0 8px; }
.modal .buttons { flex-wrap: wrap; justify-content: flex-end; margin-top: 12px; }
.dev .row { margin: 6px 0; }
pre.state { font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow: auto; }
.goals .goal-main { font-size: 18px; font-weight: 700; margin: 4px 0; }
.goals .goal-list div { margin: 2px 0; }
meter { flex: 1; min-width: 0; height: 10px; }
.item.locked { opacity: 0.6; }
button.wide { width: 100%; padding: 12px; margin-top: 8px; }
.item.tap { cursor: pointer; }
.new { font-size: 10px; font-weight: 700; margin-left: 6px; padding: 1px 4px; border-radius: 4px; background: var(--btn); color: var(--btn-fg); }
.article .rubric { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.article h2 { font-size: 22px; line-height: 1.2; margin: 6px 0 10px; }
.article p { margin: 8px 0; }
.dev-tap { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
.dev .row.spread input { flex: 0 0 90px; width: 90px; }
.dev .row.spread input[type="checkbox"] { flex: 0 0 auto; width: 22px; height: 22px; }

/* Задача 5.1: оболочка (нижнее меню, кнопка «Завершить день», подсказка) и главный экран в дизайне «Сейф».
   Перенос макета 04_Дизайн/главный_экран/mlrd-main-screen.html. Цвета, шрифты, отступы, скругления, тени и
   тайминги — CSS-переменные из config/theme.json (собираются при запуске, src/ui/theme.js). */
#app { font-variant-numeric: var(--num); -webkit-tap-highlight-color: transparent; }
.press { cursor: pointer; touch-action: manipulation; transition: transform var(--dur-release) var(--ease-spring); }
.press:active { transform: scale(.97); transition-duration: var(--dur-press); }

/* нижнее меню — на всех экранах */
#nav { flex: none; display: flex; box-sizing: content-box; height: var(--h-nav); padding: 0 8px max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px); background: var(--color-bg); border: 0; }
#nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 0; border: 0; border-radius: 0; background: none; color: var(--color-mute); font: var(--type-nav); cursor: pointer; transition: transform var(--dur-release) var(--ease-spring); }
#nav button:active { transform: scale(.9); }
#nav button.active { color: var(--color-nav-active); font-weight: 700; }
#nav .nav-icon, #nav .nav-icon svg { display: block; width: 22px; height: 22px; }
#nav .dot { position: absolute; top: 6px; left: calc(50% + 7px); width: 7px; height: 7px; border-radius: 50%; background: var(--color-gold); box-shadow: var(--shadow-badge-ring); }

/* кнопка «Завершить день» */
#actionbar { flex: none; padding: 8px var(--space-screen-x) 6px; }
button.end-day { width: 100%; height: var(--h-button); margin: 0; padding: 0; border: 0; border-radius: var(--radius-button); background: var(--btn-bg); color: var(--btn-ink); display: flex; align-items: center; justify-content: center; font: var(--type-button); letter-spacing: var(--ls-button); cursor: pointer; box-shadow: var(--shadow-button); transition: transform var(--dur-release) var(--ease-spring), box-shadow var(--dur-release); }
button.end-day.pressed, button.end-day:active { transform: translateY(4px) scale(.99); box-shadow: var(--shadow-button-pressed); transition-duration: var(--dur-press); }
button.end-day:disabled, button.end-day:disabled.pressed { opacity: .45; cursor: default; transform: none; box-shadow: var(--shadow-button); }

/* короткая подсказка по нажатию на плитку */
#toast { position: fixed; left: var(--space-screen-x); right: var(--space-screen-x); bottom: calc(var(--h-nav) + var(--h-button) + 28px + max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px)); z-index: 8; padding: 10px 14px; border-radius: var(--radius-card); background: var(--color-ink); color: var(--color-bg); font: 600 13px/1.4 var(--font-ui); box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); }
#toast[hidden] { display: none; }

/* главный экран: всё стоит на месте, прокручивается только .list */
#screen.home { padding: max(0px, calc(var(--space-block) - var(--safe-top, 0px))) 0 0; overflow: hidden; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
#screen.home > .card { flex: none; margin: 0 var(--space-screen-x) var(--space-block); }
.home *::-webkit-scrollbar { display: none; width: 0; height: 0; }

.vault { flex: none; margin: 0 var(--space-screen-x); position: relative; border-radius: var(--radius-vault); background: var(--vault-bg); color: var(--vault-ink); padding: var(--pad-vault); overflow: hidden; box-shadow: var(--shadow-vault); }
.vault:active { transform: scale(.985); }
.vault .sheen { position: absolute; inset: 0; background: linear-gradient(118deg, transparent 30%, rgba(255,255,255,.075) 44%, transparent 58%); pointer-events: none; }
.vault .r1, .vault .r2 { position: absolute; border-radius: 50%; pointer-events: none; }
.vault .r1 { right: -40px; top: -40px; width: 150px; height: 150px; border: 1px solid rgba(255,255,255,.07); }
.vault .r2 { right: -10px; top: -10px; width: 90px; height: 90px; border: 1px solid rgba(255,255,255,.06); }
.brand { position: relative; font: var(--type-brand); letter-spacing: var(--ls-brand); color: var(--color-gold); }
.cap-lbl { position: relative; font: var(--type-capital-label); opacity: .6; margin-top: 6px; }
.cap { position: relative; font: var(--type-capital); letter-spacing: var(--ls-capital); white-space: nowrap; transform-origin: left center; transition: transform var(--dur-capital-pop) var(--ease-pop); }
.cap.pop { transform: scale(1.04); transition: none; }
.delta-row { position: relative; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.delta { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); background: var(--vault-pill); font: var(--type-delta); }
.delta.up { color: var(--color-up-on-dark); }
.delta.down { color: var(--color-down-on-dark); }
.delta span:last-child { opacity: .85; font-weight: 600; }
.delta-row small { font-size: 12px; opacity: .55; }
.goal { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--vault-divider); }
.ring { position: relative; width: var(--goal-ring); height: var(--goal-ring); flex: none; }
.ring b { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--color-gold) 0 calc(var(--ring, 0) * 360deg), var(--vault-ring-track) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: var(--type-goal-ring); }
.goal-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.goal-txt small { font: var(--type-goal-label); opacity: .55; }
.goal-txt div { font: var(--type-goal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal .chev, .goal .chev svg { display: block; width: 16px; height: 16px; color: var(--color-gold); flex: none; }

.metrics { flex: none; margin: var(--space-block) var(--space-screen-x) 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--space-grid); }
.metric { border-radius: var(--radius-card); background: var(--color-surface); padding: var(--pad-metric); display: flex; flex-direction: column; gap: 1px; }
.metric small { font: var(--type-metric-label); color: var(--color-mute); }
.metric div { font: var(--type-metric); white-space: nowrap; }
.metric div.low { color: var(--color-down); }
.metric.neg { background: var(--color-down-bg); box-shadow: inset 0 0 0 1.5px var(--color-down); }
.metric.neg small, .metric.neg div { color: var(--color-down); }

/* состояние «долг»: предупреждение под плитками (spec.md, раздел 2a) */
.debt { flex: none; margin: var(--space-block) var(--space-screen-x) 0; display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-radius: 12px; background: var(--color-down); color: var(--color-tag-ink); }
.debt i { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--color-tag-ink); display: flex; align-items: center; justify-content: center; font: normal 800 10px/1 var(--font-ui); }
.debt span { flex: 1; min-width: 0; font: 700 12px/1.3 var(--font-ui); text-wrap: pretty; }

/* строка состояний: плашки стоят, лишние листаются вбок; затухание у края, где есть продолжение */
.chips-wrap { flex: none; margin: var(--space-block) var(--space-screen-x) 0; display: flex; gap: var(--space-list); min-width: 0; }
.chips { flex: 1; min-width: 0; display: flex; gap: var(--space-list); overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
.chips.more-right { -webkit-mask: linear-gradient(90deg, #000 calc(100% - 18px), transparent); mask: linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
.chips.more-left { -webkit-mask: linear-gradient(90deg, transparent, #000 18px); mask: linear-gradient(90deg, transparent, #000 18px); }
.chips.more-left.more-right { -webkit-mask: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); mask: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
.chip { flex: none; height: var(--h-chip); padding: var(--pad-chip); border-radius: var(--radius-chip); background: var(--color-chip); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.chip i { width: 7px; height: 7px; transform: rotate(45deg); }
.chip i.gold { background: var(--color-gold); }
.chip i.heat { background: var(--color-heat); }
.chip i.down { background: var(--color-down); }
.chip b { font: var(--type-chip-title); }
.chip span { font: var(--type-chip-detail); color: var(--color-mute); }

.note { flex: none; margin: var(--space-block) var(--space-screen-x) 0; background: var(--color-paper); color: var(--color-paper-ink, var(--color-ink)); padding: var(--pad-note); border-top: 3px solid var(--color-paper-ink, var(--color-ink)); box-shadow: var(--shadow-note); position: relative; transition: opacity var(--dur-note-fade) ease, transform var(--dur-note-rise) var(--ease-rise); }
.note::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: var(--color-paper-ink, var(--color-ink)); }
.note.out { opacity: 0; transform: translateY(6px); transition: none; }
.kick { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 4px; font: var(--type-kicker); letter-spacing: var(--ls-kicker); text-transform: uppercase; }
.kick div { flex: none; white-space: nowrap; }
.kick div:last-child { font-weight: 600; letter-spacing: .12em; color: var(--color-paper-mute); }
.kick .tone-neutral { color: var(--color-kicker-neutral); }
.kick .tone-up, .kick .tone-swanUp { color: var(--color-up); }
.kick .tone-down, .kick .tone-swan { color: var(--color-down); }
.headline { font: var(--type-headline); margin-top: 3px; text-wrap: pretty; }

.list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 0 var(--space-screen-x) 6px; }
.sec { margin: 10px 2px 6px; display: flex; align-items: center; gap: 8px; font: var(--type-section); }
.sec .total { margin-left: auto; font: 800 14px/1 var(--font-ui); letter-spacing: -.01em; white-space: nowrap; color: var(--color-ink); }
.badge { min-width: 18px; height: 18px; border-radius: var(--radius-badge); background: var(--color-gold); color: var(--color-gold-ink); font: 800 11px/1 var(--font-ui); display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.market { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-grid); }
.mcard { position: relative; border-radius: var(--radius-market); background: var(--color-surface); padding: var(--pad-market-card); overflow: hidden; }
.mcard:active { transform: scale(.95); }
.fx { position: absolute; inset: 0; background: transparent; transition: background-color var(--dur-flash-fade) var(--ease-settle); pointer-events: none; }
.fx.up { background: var(--color-up-bg); transition: none; }
.fx.down { background: var(--color-down-bg); transition: none; }
.mcard .in { position: relative; display: flex; flex-direction: column; gap: 5px; }
.logo-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
.logo-row .ic { width: var(--logo-icon-market); height: var(--logo-icon-market); flex: none; }
.logo-row .ic svg, .wm svg { display: block; width: auto; height: 100%; }
.logo-row .wm { height: var(--logo-wordmark-market); min-width: 0; color: var(--color-ink); }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.price { font: var(--type-price); letter-spacing: var(--ls-price); white-space: nowrap; transition: color var(--dur-flash-fade) ease-out; }
.price.up { color: var(--color-up); transition: none; }
.price.down { color: var(--color-down); transition: none; }
.chg { flex: none; font: var(--type-change); padding: 1px 5px; border-radius: var(--radius-change); white-space: nowrap; }
.chg.up { background: var(--color-up-bg); color: var(--color-up); }
.chg.down { background: var(--color-down-bg); color: var(--color-down); }
.chg.flat { background: var(--color-line); color: var(--color-mute); }
.tag { align-self: flex-start; font: var(--type-tag); padding: 2px 6px; border-radius: var(--radius-tag); color: var(--color-tag-ink); }
.tag.crash { background: var(--color-down); }
.tag.hot { background: var(--color-heat); }
.bar { height: var(--h-ceiling-bar); border-radius: var(--radius-bar); background: var(--color-track); overflow: hidden; margin-top: 2px; }
.bar b { display: block; height: 100%; width: calc(var(--bar, 0) * 100%); border-radius: var(--radius-bar); background: var(--color-gold); transition: width var(--dur-bar) var(--ease-bar); }
.bar b.above { background: var(--color-heat); }
.ceil { font: var(--type-ceiling); color: var(--color-mute); white-space: nowrap; }
.empty { border-radius: var(--radius-card); border: 1.5px dashed var(--color-line); padding: 14px 16px; font-size: 13.5px; color: var(--color-mute); line-height: 1.45; }
.port { display: flex; flex-direction: column; gap: var(--space-list); }
.pos { position: relative; border-radius: var(--radius-card); background: var(--color-surface); padding: var(--pad-position); overflow: hidden; }
.pos .in { position: relative; display: flex; align-items: center; gap: 10px; }
.pos .l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pos .wm { height: var(--logo-wordmark-portfolio); margin: -3px 0 -2px -1px; align-self: flex-start; color: var(--color-ink); }
.pos .meta { font: var(--type-position-meta); color: var(--color-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos .r { flex: none; white-space: nowrap; min-width: max-content; padding-left: 4px; display: flex; flex-direction: column; align-items: flex-end; }
.pos .r.up { color: var(--color-up); }
.pos .r.down { color: var(--color-down); }
.pos .r.flat { color: var(--color-mute); }
.pos .r div { display: flex; justify-content: flex-end; }
.pos .r div:first-child { font: var(--type-pnl); }
.pos .r div:last-child { font: var(--type-pnl-pct); }

/* компактный режим: высота экрана меньше 760px (токены меняет config/theme.json → compact) */
:root.compact .cap-lbl { margin-top: 4px; }
:root.compact .goal { margin-top: 8px; padding-top: 8px; }
:root.compact .kick { display: none; }
:root.compact .headline { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root.compact .sec { margin: 8px 2px 6px; }
:root.compact #actionbar { padding: 6px var(--space-screen-x) 4px; }

/* без анимаций, если так настроено в системе: значения меняются сразу */
@media (prefers-reduced-motion: reduce) {
  .press, .cap, .note, .fx, .price, .bar b, button.end-day, #nav button { transition: none; }
}

/* Задача 5.3: шторка покупки и продажи акций и уведомление о сделке.
   Перенос макета 04_Дизайн/шторка_торговли/mlrd-trade-sheet.html. Цвета, размеры и тайминги — CSS-переменные
   из config/theme.json и theme-colors.json. Классы с приставкой t- — чтобы не пересекаться с главным экраном. */
#sheet { position: fixed; inset: 0; z-index: 9; overflow: hidden; pointer-events: none; font-variant-numeric: var(--num); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#sheet[hidden] { display: none; }
.t-scrim { position: absolute; inset: 0; background: var(--color-scrim); opacity: 0; transition: opacity var(--dur-scrim) ease; }
#sheet.open .t-scrim { opacity: 1; pointer-events: auto; }

.t-sheet { position: absolute; left: 0; right: 0; bottom: var(--kb, 0px); max-height: calc(100% - var(--safe-top, 0px) - 8px - var(--kb, 0px)); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--sheet-bg); color: var(--color-ink); font-family: var(--font-ui); padding: var(--pad-sheet); padding-bottom: calc(max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px) + 4px); display: flex; flex-direction: column; gap: var(--gap-sheet); box-shadow: 0 -1px 0 rgba(255,255,255,.3), 0 -20px 40px -20px rgba(0,0,0,.5); transform: translateY(105%); transition: transform var(--dur-sheet-close) var(--ease-sheet-close); overflow: hidden; pointer-events: auto; }
#sheet.open .t-sheet { transform: translateY(0); transition: transform var(--dur-sheet-open) var(--ease-sheet-open); }
#sheet.open .t-sheet.dragging { transform: translateY(var(--drag, 0px)); transition: none; }
#sheet.open .t-sheet.snap { transition: transform var(--dur-snap-back) var(--ease-sheet-open); }
.t-sheet button { font-family: var(--font-ui); padding: 0; margin: 0; touch-action: manipulation; }
.t-ico, .t-ico svg { display: block; }

.t-grab { display: flex; flex-direction: column; gap: var(--gap-sheet); touch-action: none; cursor: grab; }
.t-handle { align-self: center; width: 38px; height: 5px; border-radius: 3px; background: var(--sheet-handle); margin-bottom: -2px; }
.t-head { display: flex; align-items: center; gap: 10px; }
.t-head .ic { width: 34px; height: 34px; flex: none; }
.t-head .wm { height: 22px; min-width: 0; color: var(--color-ink); }
.t-head .ic svg, .t-head .wm svg { display: block; width: auto; height: 100%; }
.t-head .pr { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.t-head .price { font: var(--type-sheet-price); letter-spacing: -.03em; white-space: nowrap; }
.t-chg { font: 800 11px/1.3 var(--font-ui); padding: 1px 6px; border-radius: var(--radius-change); white-space: nowrap; }
.t-chg.up { background: var(--color-up-bg); color: var(--color-up); }
.t-chg.down { background: var(--color-down-bg); color: var(--color-down); }
.t-chg.flat { background: var(--color-line); color: var(--color-mute); }
.t-ceil { display: flex; flex-direction: column; gap: 6px; }
.t-cbar { position: relative; height: 6px; border-radius: 3px; background: var(--color-track); }
.t-cbar .g { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--fill, 0) * 100%); border-radius: 3px; background: var(--color-gold); transition: width var(--dur-bar) var(--ease-bar); }
.t-cbar .h { position: absolute; top: 0; bottom: 0; left: calc(var(--tick, 0) * 100%); width: calc(var(--over, 0) * 100%); border-radius: 0 3px 3px 0; background: var(--color-heat); }
.t-cbar .k { position: absolute; top: -4px; bottom: -4px; left: calc(var(--tick, 0) * 100%); width: 2px; margin-left: -1px; border-radius: 1px; background: var(--color-ink); }
.t-cline { display: flex; align-items: center; gap: 8px; min-height: 20px; font: 600 11px/1.2 var(--font-ui); color: var(--color-mute); white-space: nowrap; }
.t-cline .over { font-weight: 800; color: var(--color-over-ceiling); }
.t-tag { margin-left: auto; display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: var(--radius-tag); color: var(--color-tag-ink); font: 800 10.5px/1 var(--font-ui); }
.t-tag.hot { background: var(--color-heat); }
.t-tag.crash { background: var(--color-down); }
.t-tag svg { width: 12px; height: 12px; }

.t-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: var(--radius-seg); background: var(--seg-track); }
.t-tabs button { height: var(--h-seg); border: 0; border-radius: 12px; background: transparent; color: var(--color-mute); font: 600 13px/1 var(--font-display); cursor: pointer; transition: background .2s, color .2s; }
.t-tabs button.on { background: var(--seg-on); color: var(--color-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.t-tabs button:disabled { opacity: .4; cursor: default; }

.t-pos { border-radius: var(--radius-card); background: var(--color-surface); padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.t-pos small { display: block; font: 600 10.5px/1.3 var(--font-ui); color: var(--color-mute); }
.t-pos .v { font: 800 15px/1.3 var(--font-ui); white-space: nowrap; }
.t-pos .v span { color: var(--color-mute); font-weight: 600; }
.t-pos .ob { width: 74px; height: 4px; border-radius: 2px; background: var(--color-track); overflow: hidden; margin-top: 3px; }
.t-pos .ob b { display: block; height: 100%; width: calc(var(--own, 0) * 100%); border-radius: 2px; background: var(--color-ink); transition: width var(--dur-bar) var(--ease-bar); }
.t-pos .ob b.full { background: var(--color-gold); }
.t-pos .avg { padding-left: 12px; border-left: 1px solid var(--color-line); }
.t-pos .pl { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
.t-pos .pl.up, .t-row b.up { color: var(--color-up); }
.t-pos .pl.down, .t-row b.down { color: var(--color-down); }
.t-pos .pl.flat, .t-row b.flat { color: var(--color-mute); }
.t-pos .pl div:first-child { font: 800 15px/1.3 var(--font-ui); }
.t-pos .pl div:last-child { font: 700 10.5px/1.3 var(--font-ui); }

.t-qty { display: flex; align-items: center; gap: 10px; }
.t-qbtn { flex: none; width: var(--h-qty-btn); height: var(--h-qty-btn); border-radius: 50%; border: 0; background: var(--color-surface); color: var(--color-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform var(--dur-release) var(--ease-spring); touch-action: none; }
.t-qbtn:active { transform: scale(.9); transition-duration: var(--dur-press); }
.t-qbtn svg { width: 22px; height: 22px; }
.t-qbtn:disabled { opacity: .35; cursor: default; }
.t-qnum { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.t-sheet input.t-qinput { flex: none; width: 100%; min-width: 0; padding: 0 0 2px; margin: 0; border: 0; border-bottom: 1.5px solid transparent; border-radius: 0; outline: 0; background: transparent; color: var(--color-ink); caret-color: var(--color-ink); font: var(--type-qty); letter-spacing: var(--ls-qty); font-variant-numeric: var(--num); text-align: center; -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
.t-sheet input.t-qinput:focus { border-bottom-color: var(--color-line); }
.t-qnum small { font: 600 11px/1 var(--font-ui); color: var(--color-mute); margin-top: 4px; }
.t-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.t-chips button { height: var(--h-qty-chip); border: 0; border-radius: var(--radius-qty-chip); background: var(--color-surface); color: var(--color-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform var(--dur-release) var(--ease-spring), background .15s; }
.t-chips button:active { transform: scale(.94); transition-duration: var(--dur-press); }
.t-chips button.on { background: var(--chip-on-bg); color: var(--chip-on-ink); }
.t-chips b { font: 800 13px/1.2 var(--font-ui); }
.t-chips small { font: 600 10.5px/1.2 var(--font-ui); opacity: .7; }
.t-cap { display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 11.5px/1.2 var(--font-ui); color: var(--color-mute); margin-top: -4px; white-space: nowrap; }
.t-cap svg { width: 14px; height: 14px; flex: none; }
.t-cap.blink { animation: t-blink var(--dur-hint-blink) ease both; }
@keyframes t-blink { 0%, 100% { color: var(--color-mute); transform: scale(1); } 30% { color: var(--color-down); transform: scale(1.06); } }
/* клавиатура открыта и шторка не помещается: сначала прячутся позиция и доли, затем вкладки и шкала */
.t-sheet.squeeze .t-pos, .t-sheet.squeeze .t-chips { display: none; }
.t-sheet.squeeze2 .t-tabs, .t-sheet.squeeze2 .t-ceil { display: none; }

.t-block { border-radius: var(--radius-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--color-surface); }
.t-block.owe { background: var(--color-down-bg); box-shadow: inset 0 0 0 1.5px var(--color-down); }
.t-block .bt { display: flex; align-items: center; gap: 10px; }
.t-block .bi { flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--color-track); color: var(--color-ink); }
.t-block.owe .bi { background: var(--color-down); color: var(--color-tag-ink); }
.t-block .bi svg { width: 19px; height: 19px; }
.t-block .bh { font: 800 15px/1.25 var(--font-ui); }
.t-block .bs { font: 600 12px/1.35 var(--font-ui); color: var(--color-mute); text-wrap: pretty; }
.t-block.owe .bh, .t-block.owe .bs b { color: var(--color-down); }
.t-block .go { height: 44px; border-radius: 22px; border: 1.5px solid var(--color-ink); background: transparent; color: var(--color-ink); font: 600 13px/1 var(--font-display); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.t-block .go:active { transform: scale(.97); }

.t-sum { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--color-line); }
.t-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.t-row span { font: var(--type-summary-key); color: var(--color-mute); white-space: nowrap; }
.t-row b { font: var(--type-summary-val); white-space: nowrap; transform-origin: right center; }
.t-row b.big { font-size: 17px; }
.t-rew { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -2px; }
.t-rew div { height: 26px; padding: 0 9px 0 6px; border-radius: var(--radius-reward); background: var(--reward-bg); color: var(--reward-ink); display: flex; align-items: center; gap: 5px; font: var(--type-reward); white-space: nowrap; }
.t-rew svg { width: 13px; height: 13px; fill: currentColor; }
@keyframes t-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.t-err { font: 700 12px/1.3 var(--font-ui); color: var(--color-down); text-align: center; }

.t-cta { position: relative; height: var(--h-trade-button); margin-top: 4px; margin-bottom: 5px; flex: none; border: 0; border-radius: var(--radius-button); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: transform var(--dur-release) var(--ease-spring), box-shadow var(--dur-release); }
.t-sheet button.t-cta { margin: 4px 0 5px; }
.t-cta.buy { background: var(--btn-buy-bg); color: var(--btn-buy-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 5px 0 var(--btn-buy-edge), 0 16px 24px -14px var(--btn-buy-edge); }
.t-cta.sell { background: var(--btn-sell-bg); color: var(--btn-sell-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 5px 0 var(--btn-sell-edge), 0 16px 24px -14px var(--btn-sell-edge); }
.t-cta:active:not(:disabled) { transform: translateY(4px) scale(.99); transition-duration: var(--dur-press); }
.t-cta.buy:active:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 var(--btn-buy-edge); }
.t-cta.sell:active:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 0 var(--btn-sell-edge); }
.t-cta:disabled { background: var(--btn-off-bg); color: var(--btn-off-ink); box-shadow: none; cursor: default; opacity: 1; }
.t-cta .l { font: var(--type-button); letter-spacing: var(--ls-button); white-space: nowrap; }
.t-cta .s { font: 800 14px/1 var(--font-ui); opacity: .75; white-space: nowrap; }

/* уведомление о сделке над кнопкой «Завершить ход» */
#trade-toast { position: fixed; left: var(--space-screen-x); right: var(--space-screen-x); bottom: calc(var(--h-nav) + var(--h-button) + 14px + max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px)); z-index: 9; border-radius: 18px; background: var(--toast-bg); color: var(--toast-ink); padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 18px 30px -16px rgba(0,0,0,.6); transform: translateY(20px); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .35s var(--ease-sheet-open); font-variant-numeric: var(--num); }
#trade-toast.on { opacity: 1; transform: translateY(0); }
#trade-toast .ti { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--toast-icon-bg); }
#trade-toast .ti svg { width: 18px; height: 18px; }
#trade-toast .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
#trade-toast .tt b { font: 800 13.5px/1.3 var(--font-ui); }
#trade-toast { overflow: hidden; }
#trade-toast .sheen { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(226,196,131,.35) 50%, transparent 65%); animation: t-sheen 900ms cubic-bezier(.3,.6,.3,1) 60ms both; }
@keyframes t-sheen { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
#trade-toast .rw { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
#trade-toast .rw span { height: 22px; padding: 0 8px 0 5px; border-radius: var(--radius-reward); background: var(--btn-bg); color: var(--btn-ink); display: flex; align-items: center; gap: 4px; font: var(--type-reward); white-space: nowrap; animation: t-pop var(--dur-reward-pop) var(--ease-reward-pop) both; }
#trade-toast .rw span:nth-child(2) { animation-delay: var(--stagger-reward); }
#trade-toast .rw span:nth-child(3) { animation-delay: calc(var(--stagger-reward) * 2); }
#trade-toast .rw span:nth-child(4) { animation-delay: calc(var(--stagger-reward) * 3); }
#trade-toast .rw i, #trade-toast .rw svg { display: block; width: 12px; height: 12px; fill: currentColor; }
#trade-toast .tv { flex: none; font: 800 15px/1 var(--font-ui); white-space: nowrap; }
#trade-toast .tv.up { color: var(--color-up-on-dark); }
#trade-toast .tv.down { color: var(--color-down-on-dark); }

/* компактный режим: высота экрана меньше 760px (токены — config/theme.json → compact) */
:root.compact .t-head .ic { width: 30px; height: 30px; }
:root.compact .t-head .wm { height: 20px; }
:root.compact .t-pos { padding: 8px 12px; }
:root.compact .t-sum { padding-top: 8px; gap: 4px; }
:root.compact .t-block { padding: 12px; gap: 8px; }

/* без анимаций, если так настроено в системе: открытие и закрытие мгновенные, анимации награды отключены */
@media (prefers-reduced-motion: reduce) {
  .t-sheet, #sheet.open .t-sheet, .t-scrim, #trade-toast { transition-duration: 1ms !important; }
  #trade-toast .sheen { display: none; }
  #trade-toast .rw span, .t-cap.blink { animation: none !important; }
}

/* Задача 5.5: венчур в новом дизайне — вкладка, шторка решения, окно автовыхода, плашка «нужно решение».
   Перенос макета 04_Дизайн/венчур/mlrd-venture.html. Цвета, размеры и тайминги — CSS-переменные из
   config/theme.json и theme-colors.json. Классы с приставкой v-. */
.v-ico, .v-ico svg { display: block; width: 100%; height: 100%; }

/* ——— вкладка ——— */
#screen.venture { display: flex; flex-direction: column; gap: 6px; padding: 0 var(--space-screen-x) 8px; overscroll-behavior: contain; scrollbar-width: none; user-select: none; -webkit-user-select: none; font-variant-numeric: var(--num); }
#screen.venture::-webkit-scrollbar { display: none; }
#screen.venture ~ #nav { border-top: 1px solid var(--color-line); }
#screen.venture > * { flex: none; }
.v-head { display: flex; align-items: baseline; gap: 8px; padding: 2px 2px 4px; }
.v-head .title { font: 600 13px/1.2 var(--font-display); }
.v-head .cash { margin-left: auto; font: 600 12px/1.3 var(--font-ui); color: var(--color-mute); white-space: nowrap; }
.v-head .cash b { color: var(--color-ink); font-weight: 800; }
.v-head .cash.owe, .v-head .cash.owe b { color: var(--color-down); }
.v-locked { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--color-surface); font: 700 12px/1.3 var(--font-ui); color: var(--color-mute); }
.v-locked .v-ico { flex: none; width: 12px; height: 12px; }
.v-goal { border-radius: 16px; background: var(--color-surface); padding: 7px 12px; display: flex; align-items: center; gap: 12px; }
.v-goal .ring { flex: none; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--color-gold) 0 calc(var(--ring, 0) * 360deg), var(--color-track) 0); display: flex; align-items: center; justify-content: center; }
.v-goal .ring div { width: 22px; height: 22px; border-radius: 50%; background: var(--color-surface); display: flex; align-items: center; justify-content: center; font: 800 9.5px/1 var(--font-ui); white-space: nowrap; }
.v-goal .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.v-goal small { font: 600 11px/1.3 var(--font-ui); color: var(--color-mute); }
.v-goal .txt div { font: 700 13.5px/1.3 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v-reason { border-radius: 12px; padding: 8px 12px; background: var(--color-down); color: var(--color-tag-ink); display: flex; align-items: center; gap: 10px; }
.v-reason i { flex: none; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--color-tag-ink); display: flex; align-items: center; justify-content: center; font: normal 800 10px/1 var(--font-ui); }
.v-reason span { font: 700 12px/1.3 var(--font-ui); text-wrap: pretty; }

.v-round { height: var(--h-round); border-radius: var(--radius-round); display: flex; align-items: center; gap: 12px; padding: 0 7px 0 16px; color: var(--round-ink); }
.v-round .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.v-round .n { font: var(--type-round-name); white-space: nowrap; }
.v-round .s { display: flex; align-items: center; gap: 5px; font: var(--type-round-sub); white-space: nowrap; }
.v-round.open .s { opacity: .7; }
.v-round .s .v-ico { flex: none; width: 11px; height: 11px; }
.v-round.r1 { background: var(--round-1-bg); }
.v-round.r2 { background: var(--round-2-bg); }
.v-round.r3 { background: var(--round-3-bg); }
.v-round.r4 { background: var(--round-4-bg); color: var(--round-4-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.v-round.off { box-shadow: inset 0 0 0 1.5px var(--round-off-line); color: var(--color-mute); }
.v-round .box { flex: none; width: var(--w-round-btn); height: var(--h-round-btn); border-radius: var(--radius-round-btn); box-shadow: inset 0 0 0 1.5px var(--round-off-box); display: flex; align-items: center; justify-content: center; font: var(--type-round-sum); white-space: nowrap; }
.v-invest { flex: none; width: var(--w-round-btn); height: var(--h-round-btn); margin: 0; padding: 0; border: 0; border-radius: var(--radius-round-btn); background: var(--btn-buy-bg); color: var(--btn-buy-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; touch-action: manipulation; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 0 var(--btn-buy-edge); transition: transform var(--dur-release) var(--ease-spring); }
.v-invest:active { transform: translateY(2px) scale(.97); transition-duration: var(--dur-press); }
.v-invest small { font: 700 10.5px/1 var(--font-ui); opacity: .75; white-space: nowrap; }
.v-invest b { font: var(--type-round-sum); white-space: nowrap; }

/* карточка идущего стартапа */
.v-card { border-radius: var(--radius-round); background: var(--venture-card-bg); padding: 0 14px 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 2px var(--venture-card-ring), 0 14px 24px -16px rgba(0,0,0,.5); }
.v-card .top { height: var(--h-round); display: flex; align-items: center; gap: 12px; }
.v-card .top .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.v-card .top .n { font: var(--type-round-name); }
.v-card .top .s { font: var(--type-round-sub); color: var(--color-mute); white-space: nowrap; }
.v-card .pill { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--color-ink); color: var(--color-bg); display: flex; align-items: center; gap: 4px; font: 800 13px/1 var(--font-ui); white-space: nowrap; }
.v-card .pill small { font: 600 11px/1 var(--font-ui); opacity: .7; }
.v-tl { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: var(--gap-tl); margin-top: -6px; }
.v-tl .v-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.v-tl .mk { height: 12px; display: flex; align-items: center; justify-content: center; color: var(--color-gold); }
.v-tl .mk.up { color: var(--color-up); }
.v-tl .mk.down { color: var(--color-down); }
.v-tl .mk i { width: var(--size-tl-marker); height: var(--size-tl-marker); transform: rotate(45deg); box-shadow: inset 0 0 0 1.5px currentColor; }
.v-tl .mk i.on { background: currentColor; }
.v-tl .mk .v-ico { width: 12px; height: 12px; }
.v-tl .bar { width: 100%; height: var(--h-tl-bar); border-radius: 3px; background: var(--tl-future); }
.v-tl .bar.done { background: var(--tl-done); }
.v-tl .bar.now { background: var(--tl-now); }
.v-next { display: flex; align-items: center; gap: 8px; font: 600 12px/1.3 var(--font-ui); color: var(--color-mute); white-space: nowrap; }
.v-next b { color: var(--color-ink); }
.v-next .dia { flex: none; width: 8px; height: 8px; transform: rotate(45deg); box-shadow: inset 0 0 0 1.5px var(--color-gold); }
.v-next .flag { flex: none; width: 12px; height: 12px; color: var(--color-gold); }
.v-next .split { margin-left: auto; }

/* новость и решение — во вкладке и в шторке */
.v-kick { display: flex; align-items: center; gap: 7px; }
.v-kick.up { color: var(--color-up); }
.v-kick.down { color: var(--color-down); }
.v-kick i { flex: none; width: 7px; height: 7px; transform: rotate(45deg); background: currentColor; }
.v-kick div { font: 800 10.5px/1.2 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.v-kick .mult { margin-left: auto; font: 800 17px/1 var(--font-ui); letter-spacing: -.02em; }
.v-news { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--color-line); }
.v-news .title { font: 800 17px/1.25 var(--font-ui); text-wrap: pretty; }
.v-opts { display: flex; flex-direction: column; gap: 6px; }
.v-opt { height: 52px; margin: 0; border: 0; border-radius: 26px; padding: 0 18px; display: flex; align-items: center; gap: 10px; background: var(--decision-btn-bg); color: var(--color-ink); box-shadow: inset 0 0 0 1.5px var(--color-line); cursor: pointer; touch-action: manipulation; font-family: var(--font-ui); transition: transform var(--dur-release) var(--ease-spring); }
.v-opt:active:not(:disabled) { transform: scale(.97); transition-duration: var(--dur-press); }
.v-opt:disabled { opacity: .4; cursor: default; }
.v-opt .t { flex: 1; min-width: 0; text-align: left; font: 800 14px/1.2 var(--font-ui); }
.v-opt .s { flex: none; font: 800 14px/1.2 var(--font-ui); white-space: nowrap; }

/* ——— шторка решения поверх главного ——— */
#vsheet { position: fixed; inset: 0; z-index: 9; overflow: hidden; pointer-events: none; font-variant-numeric: var(--num); user-select: none; -webkit-user-select: none; }
#vsheet[hidden] { display: none; }
#vsheet .v-scrim { position: absolute; inset: 0; background: var(--color-scrim); opacity: 0; transition: opacity var(--dur-scrim) ease; }
#vsheet.open .v-scrim { opacity: 1; pointer-events: auto; }
.v-sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; background: var(--sheet-bg); color: var(--color-ink); padding: 8px 16px calc(max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px) + 4px); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -10px 30px -12px rgba(0,0,0,.35); transform: translateY(105%); transition: transform var(--dur-sheet-close) var(--ease-sheet-close); pointer-events: auto; }
#vsheet.open .v-sheet { transform: translateY(0); transition: transform var(--dur-sheet-open) var(--ease-sheet-open); }
#vsheet.open .v-sheet.dragging { transform: translateY(var(--drag, 0px)); transition: none; }
.v-grab { display: flex; flex-direction: column; gap: 14px; touch-action: none; cursor: grab; }
.v-handle { align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--sheet-handle); }
.v-shead { display: flex; align-items: flex-end; gap: 12px; padding-top: 2px; }
.v-shead .l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.v-shead .where { font: 700 13px/1.2 var(--font-ui); color: var(--color-mute); white-space: nowrap; }
.v-shead .mult { flex: none; font: var(--type-decision-mult); letter-spacing: var(--ls-decision-mult); }
.v-shead .mult.up { color: var(--color-up); }
.v-shead .mult.down { color: var(--color-down); }
.v-stitle { font: var(--type-news); letter-spacing: -.01em; text-wrap: pretty; }
.v-sheet .v-opts { padding-top: 2px; }
.v-sheet .v-opt { height: var(--h-decision-btn); border-radius: var(--radius-decision-btn); padding: 0 20px; }
.v-sheet .v-opt .t, .v-sheet .v-opt .s { font-size: 15px; }

/* плашка «нужно решение» на главном экране */
.chip.vdec { flex: none; background: var(--chip-decision-bg); box-shadow: 0 4px 10px -6px rgba(0,0,0,.5); }
.chip.vdec i { background: none; box-shadow: inset 0 0 0 1.5px var(--chip-decision-accent); }
.chip.vdec b { color: var(--chip-decision-ink); }
.chip.vdec span { font-weight: 700; color: var(--chip-decision-accent); }

/* уведомление о досрочном выходе: подпись под заголовком; вне главного экрана — ниже, над меню */
#trade-toast .tt small.sub { font: 700 11px/1.3 var(--font-ui); opacity: .6; }
#trade-toast.low { bottom: calc(var(--h-nav) + 8px + max(var(--safe-bottom, env(safe-area-inset-bottom, 0px)), 8px)); }

/* ——— окно автовыхода ——— */
#vexit { position: fixed; inset: 0; z-index: 11; background: var(--color-scrim); display: flex; align-items: center; justify-content: center; padding: 0 28px; opacity: 0; transition: opacity var(--dur-exit-rows) ease; cursor: pointer; font-variant-numeric: var(--num); user-select: none; -webkit-user-select: none; }
#vexit[hidden] { display: none; }
#vexit.on { opacity: 1; }
.v-exit { position: relative; width: 100%; border-radius: var(--radius-exit-card); overflow: hidden; background: var(--vault-bg); color: var(--vault-ink); padding: 20px 22px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.14), 0 30px 50px -24px rgba(0,0,0,.8); }
#vexit.anim .v-exit { transform: scale(.92); transition: transform var(--dur-exit-in) var(--ease-exit-in); }
#vexit.anim.on .v-exit { transform: scale(1); }
.v-exit .head { display: flex; align-items: center; gap: 8px; }
.v-exit .flag, .v-exit .flag svg { display: block; width: 14px; height: 14px; color: var(--color-gold); }
.v-exit .head .k { font: 800 10.5px/1.2 var(--font-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--color-gold); }
.v-exit .head .r { margin-left: auto; font: 700 12px/1.2 var(--font-ui); opacity: .7; }
.v-exit .mult { font: var(--type-exit-mult); letter-spacing: var(--ls-exit-mult); white-space: nowrap; transform: scale(.96); transform-origin: left center; transition: transform 420ms var(--ease-pop), color 300ms ease; }
.v-exit.max .mult { color: var(--color-gold); }
.v-exit.minus .mult, .v-exit.zero.revealed .mult { color: var(--color-down-on-dark); }
.v-exit.revealed .mult { transform: scale(1); }
.v-exit .rows { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.1); opacity: 0; transition: opacity var(--dur-exit-rows) ease; }
.v-exit.revealed .rows { opacity: 1; }
.v-exit .rows div { display: flex; align-items: baseline; gap: 10px; }
.v-exit .rows small { font: 600 13px/1.2 var(--font-ui); opacity: .6; }
.v-exit .rows b { position: relative; margin-left: auto; font: 800 20px/1.2 var(--font-ui); letter-spacing: -.02em; white-space: nowrap; }
.v-exit .rows b.up { color: var(--color-up-on-dark); }
.v-exit .rows b.down { color: var(--color-down-on-dark); }
.v-exit .strike { position: absolute; left: -3px; top: 52%; height: 2px; width: 0; background: var(--color-down-on-dark); transition: width var(--dur-exit-strike) var(--ease-bar); }
.v-exit.revealed .strike { width: calc(100% + 6px); }
.v-exit .quip { font: var(--type-exit-quip); opacity: 0; transition: opacity var(--dur-exit-quip) ease; }
.v-exit.after .quip { opacity: 1; }
.v-exit .hint { text-align: center; font: 600 11px/1.2 var(--font-ui); opacity: .45; }
.v-exit .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 60%; background: linear-gradient(105deg, transparent, rgba(226,196,131,.35), transparent); transform: translateX(-120%); pointer-events: none; }
.v-exit.after .sheen { transform: translateX(220%); transition: transform var(--dur-exit-sheen) var(--ease-exit-sheen); }

@media (prefers-reduced-motion: reduce) {
  .v-sheet, #vsheet.open .v-sheet, #vexit, #vexit .v-exit, .v-exit .mult, .v-exit .rows, .v-exit .strike, .v-exit .quip { transition-duration: 1ms !important; }
  .v-exit .sheen { display: none; }
}

или.","events.d2.shawarmaGost.B.label":"Объявить шаурму авторской, вне стандартов","events.d2.shawarmaGost.B.okT":"Крафтовая шаурма.","events.d2.shawarmaGost.B.okText":"Ценник вырос, за шаурмой стоят хипстеры с плёночными фотоаппаратами.","events.d2.shawarmaGost.B.badT":"Авторская — значит непонятная.","events.d2.shawarmaGost.B.badText":"Не оценили ни инспекция, ни клиенты.","events.d2.carwashMotorcade.title":"Кортеж без записи","events.d2.carwashMotorcade.sub":"Семь чёрных седанов, мыть срочно. Оплата «по факту».","events.d2.carwashMotorcade.A.label":"Мыть по прайсу","events.d2.carwashMotorcade.A.okT":"Всё по-взрослому.","events.d2.carwashMotorcade.A.okText":"Оплатили без торга и попросили визитку.","events.d2.carwashMotorcade.A.badT":"Оплата по факту.","events.d2.carwashMotorcade.A.badText":"Факт наступил, а оплата нет. Водители уехали с сиреной.","events.d2.carwashMotorcade.B.label":"Полировка, воск и чай водителям","events.d2.carwashMotorcade.B.okT":"Кортеж блестит.","events.d2.carwashMotorcade.B.okText":"Щедрые чаевые и приглашение обслуживать весь автопарк.","events.d2.carwashMotorcade.B.badT":"Воск на мигалке.","events.d2.carwashMotorcade.B.badText":"Мигалка перестала мигать. Ремонт за ваш счёт.","events.d2.carwashWater.title":"Водоканал пересмотрел тариф","events.d2.carwashWater.sub":"Кубометр подорожал, а «Шланги» льют как в последний раз.","events.d2.carwashWater.A.label":"Поставить систему оборотной воды","events.d2.carwashWater.A.okT":"Экология и экономия.","events.d2.carwashWater.A.okText":"Счета за воду упали, на стене висит эко-сертификат.","events.d2.carwashWater.A.badT":"Оборотная вода пахнет оборотнем.","events.d2.carwashWater.A.badText":"Клиенты жалуются на запах в салоне.","events.d2.carwashWater.B.label":"Пробурить свою скважину","events.d2.carwashWater.B.okT":"Вода своя — маржа наша.","events.d2.carwashWater.B.okText":"Водоканал вы теперь не знаете.","events.d2.carwashWater.B.badT":"Скважина дала песок.","events.d2.carwashWater.B.badText":"И ви :"Акции. Здесь торгуются акции. Их цена постоянно колеблется. Волатильность акций компаний разная. Купи любые — например Googol.","tutorial.l1_bought":"Первая покупка. Купил! Теперь следи за ценой. Правило простое: купи дёшево — продай дороже.","tutorial.l1_sold_profit":"Прибыль! Отлично! Ты заработал на разнице. Это и есть суть биржи — лови колебания.","tutorial.l1_sold_loss":"Урок. Продал дешевле, чем купил — бывает. Урок: старайся продавать на росте, а не на спаде.","tutorial.l1_up":"📈 Акции выросли. Твои акции подорожали! Можешь продать и зафиксировать прибыль — или подождать большего роста.","tutorial.l1_down":"📉 Акции просели. Цена снизилась — это нормально, акции колеблются. Не паникуй: подожди роста или докупи дешевле.","tutorial.l1_done":"Ты освоил акции! Впереди — стартапы: риск выше, награда больше.","tutorial.l2_start":"Разблокированы Стартапы! Это венчур: вкладываешь деньги, стартап либо даёт крупный выход, либо прогорает. Акции тоже работают — используй оба инструмента для накопления капитала.","tutorial.l2_invested":"Инвестиция. Вложился! Теперь стартап будет развиваться по ходам.","tutorial.l2_win":"Стартап взлетел! Вот так выглядит удачный венчур.","tutorial.l2_fail":"Стартап прогорел. Это нормально для венчура — часть вложений сгорает.","tutorial.l2_stocks":"💡 Про акции. Не забывай про акции — они по-прежнему приносят доход.","tutorial.l2_done":"Ты понял стартапы! Дальше — новый инструмент.","tutorial.l3_start":"Новый инструмент — Палатка с шаурмой. Она даёт пассивный доход каждый ход, без твоего участия. Купи её.","tutorial.l3_dc":"Обучение завершено. Отлично! Палатка работает на тебя. Дальше ты сам управляешь империей. Удачи!","checklist.e2c1.title":"Чек-лист 1 — своя квартира","checklist.e2c2.title":"Чек-лист 2 — реклама и иксы","checklist.e2c3.title":"Чек-лист 3 — автосервис и разогрев","checklist.e2c4.title":"Чек-лист 4 — сеть бутиков","checklist.e2c5.title":"Чек-лист 5 — СПА-клуб и секрет","checklist.goal.doubleSales":"«Иксы ×{mult}» — продаж акое не пускают.","events.swan.down.2.rubric":"FORBES · РЫНКИ","events.swan.down.2.title":"Нейросеть ClosedAI попросила выходной","events.swan.down.2.text":"Рынок воспринял это как сигнал. Акции рухнули, в офисе компании выключают свет, чтобы сэкономить.","events.swan.down.3.rubric":"FORBES · СРОЧНО","events.swan.down.3.title":"Чёрный лебедь над ClosedAI","events.swan.down.3.text":"Птица редкая, но метко гадит. Капитализация компании ушла в пике. Те, у кого есть кэш, уже открывают приложение брокера.","events.swan.down.4.rubric":"FORBES · ИНСАЙД","events.swan.down.4.title":"Совет директоров ClosedAI: «Всё под контролем»","events.swan.down.4.text":"Акции не поверили и упали. Эксперты советуют покупать на страхе, психологи — сначала выдохнуть.","events.swan.down.5.rubric":"FORBES · РЫНКИ","events.swan.down.5.title":"ClosedAI: распродажа, которую никто не объявлял","events.swan.down.5.text":"Акции продаются со скидкой, о которой мечтает любая «Чёрная пятница». Главное — не стать её жертвой.","events.swan.down.6.rubric":"FORBES · СРОЧНО","events.swan.down.6.title":"Искусственный интеллект, реальные убытки","events.swan.down.6.text":"ClosedAI обвалилась после провальной презентации: новая модель на сцене перепутала котика с тостером. Рынок не простил.","events.swan.up.1.rubric":"FORBES · СРОЧНО","events.swan.up.1.title":"ClosedAI взлетает без предупреждения","events.swan.up.1.text":"Новая модель решила задачу, над которой бились десять лет, и заодно сделала годовой отчёт. Шорт-селлеры ищут валерьянку.","events.swan.up.2.rubric":"FORBES · РЫНКИ","events.swan.up.2.title":"Белый лебедь: ClosedAI в небе","events.swan.up.2.text":"Чёрные лебеди тоже бывают приятными. Держатели акций проверяют цены на Bugatti, остальные — свои нервы.","events.swan.up.3.rubric":"FORBES · ИНСАЙД","events.swan.up.3.title":"ClosedAI подписала контракт века","events.swan.up.3.text":"Детали засекречены, но рынок всё понял по лицу финдиректора. Акции резко вверх.","events.swan.up.4.rubric":"FORBES · СРОЧНО","events.swan.up.4.title":"ClosedAI: «Мы просто нажали не ту кнопку»","events.swan.up.4.text":"Случайное обновление сделало компанию самой обсуждаемой на бирже. Акции летят, юристы ищут, какую кнопку нажимать дальше.","era.article.e3.rubric":"FORBES · РЕЙТИНГ «ТЯЖЕЛОВЕСЫ ГОРОДА»","era.article.e3.title":"{name}: «Налоговая пришла за Bugatti, а ушла с путёвкой в санаторий»","era.article.e3.p1":"Холдинг перешёл в высшую лигу: ресторан со звёздами, санаторий, автосалон и логистический центр. Город ест, лечится, ездит и получает посылки через одну компанию.","era.article.e3.p2":"Конкуренты называют это монополией. {name} — «заботой о людях».","events.bg.quiet.title":"Событий нет","events.bg.quiet.sub":"Рынок спокоен","events.bg.crash.downTitle":"🦢 Чёрный лебедь: {name} {pct}","events.bg.crash.downSub":"Паника на рынке AI","events.bg.crash.upTitle":"🚀 {name}: технологический прорыв {pct}","events.bg.crash.upSub":"Рынок AI ликует","events.bg.super.title":"{name}: SUPER EVENT {pct}","events.bg.stockMove.title":"{name}: {pct}","events.bg.marketUp.title":"IT рынок {pct}","events.bg.marketDown.title":"IT рынок {pct}","events.bg.cash.era1.bonus":"Консультация на стороне","events.bg.cash.era1.penalty":"Ремонт техники","events.bg.cash.era2.bonus":"Гонорар за лекцию","events.bg.cash.era2.penalty":"Налоговая доначислила","events.bg.cash.era3.bonus":"Инсайдерская благодарность","events.bg.cash.era3.penalty":"Счёт от юристов","events.bg.cash.era4.bonus":"Продажа медиаправ","events.bg.cash.era4.penalty":"Иск от конкурента","events.decision.choice.cautious":"Осторожный","events.decision.choice.risky":"Рискованный","events.decision.engineerLeaves.title":"Уход ключевого инженера","events.decision.engineerLeaves.sub":"Главный робототехник получил оффер конкурента","events.decision.engineerLeaves.A":"Удержать премией","events.decision.engineerLeaves.B":"Переманить звезду конкурента","events.decision.engineeringSchool.title":"Своя инженерная школа","events.decision.engineeringSchool.s y=\"13\" width=\"6\" height=\"7\"></rect><rect x=\"9\" y=\"8\" width=\"6\" height=\"12\"></rect><rect x=\"15\" y=\"15\" width=\"6\" height=\"5\"></rect></svg>","nav-shop":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"6,9 9,5 15,5 18,9 12,19\"></polygon><line x1=\"6\" y1=\"9\" x2=\"18\" y2=\"9\"></line></svg>","nav-venture":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"12,3 17,15 7,15\"></polygon><line x1=\"9\" y1=\"19\" x2=\"15\" y2=\"19\"></line></svg>","plus":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 12h12M12 6v12\"></path></svg>","reward-star":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z\"></path></svg>","wallet":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"3\"></rect><path d=\"M3 10h18M16 14.5h2\"></path></svg>"}}</script>
<script>
(function () {
"use strict";
var defs = {
"src\\ui\\main.js": [function (require, module, exports) {
// Точка входа технического билда: конфиг из страницы → ядро → экраны, модалки, сохранение, время.
const { h, mount } = require("./dom");
const { makeTranslator } = require("../shared/translate");
const { createFormatter, createDesignFormatter } = require("../shared/format");
const { createStore } = require("./store");
const { createModal } = require("./modal");
const { createView } = require("./view");
const { createEffects } = require("./effects");
const decisions = require("./decisions");
const { openDev } = require("./dev");
const { createBalance } = require("./balance");
const { initTelegram } = require("./telegram");
const { createTheme } = require("./theme");
const { createMotion } = require("./home-motion");
const { createVentureSheet } = require("./venture-sheet");
const { createVentureExit } = require("./venture-exit");
const { goalsBlock } = require("./screens/goals");
const core = require("../core");
const { renderTrade } = require("./screens/trade");
const screens = {
  market: require("./screens/home").homeScreen,
  venture: require("./screens/venture").ventureScreen,
  assets: require("./screens/assets").assetsScreen,
  shop: require("./screens/others").shopScreen,
  rating: require("./screens/others").ratingScreen,
  profile: require("./screens/profile").profileScreen,
};

function boot() {
  const { cfg, texts, svg } = JSON.parse(document.getElementById("mlrd-config").textContent);
  const ui = cfg.ui;
  const t = makeTranslator(texts);
  // design — формат сумм нового дизайна (пока только главный экран), fmt — прежний формат остальных экранов.
  const app = { cfg, texts, svg, ui, t, fmt: createFormatter(cfg.meta, texts), design: createDesignFormatter(cfg.meta, texts), tab: ui.startTab, trade: { company: null, mode: null, quantity: 0 } };
  document.title = t(ui.titleKey);
  // Telegram: имя игрока, полный экран, кнопка «на экран телефона» (перерисовать, когда придёт её статус).
  const tg = initTelegram(ui.telegram, () => app.render && app.render());
  app.playerName = tg.name;
  app.homeScreen = tg.home;
  app.theme = createTheme({ ...cfg.theme, themes: cfg.themeColors.themes }, tg.call);
  app.theme.watchHeight(document.getElementById("app"));
  app.store = createStore(cfg, ui);
  app.modal = createModal(document.getElementById("modal"), t);
  app.view = createView(app);
  app.balance = createBalance(app);
  // Отметка NEW: контент открыт чек-листом и ещё не просмотрен. Заход на вкладку гасит её отметки.
  app.newIds = (tab) => {
    const state = app.store.state;
    if (!state) return [];
    const kinds = Object.entries(ui.newMarks.tabs).filter(([, tabId]) => tabId === tab);
    return kinds.flatMap(([kind]) => core.unlocks(cfg, state, kind).filter((id) => !state.seen[kind + id]).map((id) => kind + id));
  };
  app.isNew = (kind, id) => !!app.store.state && core.unlocks(cfg, app.store.state, kind).includes(id) && !app.store.state.seen[kind + id];
  app.markTabSeen = (tab) => {
    const ids = app.newIds(tab);
    if (ids.length) app.store.patchQuiet((s) => ids.forEach((key) => (s.seen[key] = true)));
  };
  app.motion = createMotion(app);
  // Направление изменения для цвета: рост, падение или «без изменений» (меньше порога).
  app.direction = (ratio) => (ratio > ui.home.flatChange ? "up" : ratio < -ui.home.flatChange ? "down" : "flat");
  // Капитал на начало текущего дня: запоминается при «Завершить ход», хранится рядом с сохранением.
  app.dayStart = (state) => {
    const saved = app.store.readExtra(ui.storage.dayStartSuffix);
    return saved && saved.turn === state.turn ? saved.capital : core.capital(cfg, state);
  };
  // Короткая подсказка поверх экрана (нажатие на плитку): гаснет сама.
  const toastEl = document.getElementById("toast");
  let toastTimer = 0;
  app.toast = (text) => {
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toastEl.hidden = true), ui.home.toastMs);
  };
  toastEl.onclick = () => (toastEl.hidden = true);
  // Уведомление о сделке над кнопкой «Завершить ход»: что куплено или продано, награды, прибыль.
  const tradeToastEl = document.getElementById("trade-toast");
  let tradeToastTimer = 0;
  app.tradeToast = (data) => {
    // Содержимое пересоздаётся — новое уведомление сразу заменяет прежнее, анимации награды идут заново.
    const rewards = data.rewards.map((text) => h("span", {}, h("i", { innerHTML: svg[ui.trade.icons.reward] }), text));
    // Общий компонент: сделки, досрочный выход из стартапа (своя иконка и подпись). Вне главного экрана —
    // ниже, над меню (кнопки «Завершить ход» там нет).
    mount(tradeToastEl, rewards.length ? h("div", { class: "sheen" }) : null, h("div", { class: "ti", innerHTML: svg[data.icon || ui.trade.icons.done] }), h("div", { class: "tt" }, h("b", {}, data.title), data.sub ? h("small", { class: "sub" }, data.sub) : null, rewards.length ? h("div", { class: "rw" }, rewards) : null), h("div", { class: "tv " + data.tone }, data.value));
    tradeToastEl.classList.toggle("low", app.tab !== ui.startTab);
    tradeToastEl.classList.add("on");
    clearTimeout(tradeToastTimer);
    tradeToastTimer = setTimeout(() => tradeToastEl.classList.remove("on"), parseFloat(cfg.theme.tokens["dur-toast"]));
  };
  app.openGoals = () => app.modal.push({ title: t("ui.home.goalsTitle"), body: goalsBlock(app, app.store.state) });
  app.ventureSheet = createVentureSheet(app);
  // Режим разработчика: объект игры доступен из консоли браузера (для проверок и скриншотов).
  if (ui.devMode) window[ui.dev.globalName] = app;
  app.ventureExit = createVentureExit(app);
  const effects = createEffects(app);
  const screenEl = document.getElementById("screen");
  const navEl = document.getElementById("nav");
  const actionEl = document.getElementById("actionbar");

  // Кнопка «Завершить ход» создаётся один раз и не пересоздаётся при перерисовке: иначе нажатие обрывается
  // на полпути и на телефоне его не видно. Вид нажатия — класс pressed (на сенсорном экране :active ненадёжен),
  // держится не меньше ui.home.pressMinMs, чтобы быстрый тап тоже был заметен.
  const endButton = h("button", { class: "end-day", onClick: () => app.endDay() }, t("ui.endDay"));
  let pressedAt = 0;
  let pressTimer = 0;
  const release = () => {
    clearTimeout(pressTimer);
