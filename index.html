<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>МЛРД · v0.5.1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Технический билд: без дизайна. Системный шрифт, серые блоки, цвета — из темы Telegram или системы. */
:root {
  color-scheme: light dark;
  --bg: var(--tg-theme-bg-color, Canvas);
  --fg: var(--tg-theme-text-color, CanvasText);
  --muted: var(--tg-theme-hint-color, GrayText);
  --card: var(--tg-theme-secondary-bg-color, color-mix(in srgb, CanvasText 6%, Canvas));
  --btn: var(--tg-theme-button-color, ButtonFace);
  --btn-fg: var(--tg-theme-button-text-color, ButtonText);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { display: flex; flex-direction: column; height: var(--app-height, 100vh); height: var(--app-height, 100dvh); }
#screen { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
nav { display: flex; border-top: 1px solid var(--muted); padding-bottom: env(safe-area-inset-bottom); background: var(--card); }
nav button { flex: 1; border: 0; background: none; padding: 10px 2px; font-size: 12px; color: var(--fg); }
nav button.active { font-weight: 700; text-decoration: underline; }
.card { background: var(--card); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
.item { border-top: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); padding: 8px 0; }
.item.owned b::after { content: " ✓"; }
.row { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
.row.spread { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.warn { font-weight: 600; margin-top: 6px; }
.big { font-size: 26px; font-weight: 700; }
.center { text-align: center; padding: 12px; }
button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); }
button.primary { background: var(--btn); color: var(--btn-fg); border-color: transparent; }
button.selected { outline: 2px solid var(--fg); }
button:disabled { opacity: 0.5; }
#actionbar { padding: 0 12px; }
#actionbar:empty { display: none; }
button.end-day { width: 100%; padding: 14px; font-size: 18px; margin: 6px 0; }
input, select { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); min-width: 0; flex: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { text-align: left; padding: 4px 2px; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.cell { border: 1px dashed var(--muted); border-radius: 6px; padding: 6px; font-size: 13px; }
.cell.got { border-style: solid; }
#modal { position: fixed; inset: 0; background: color-mix(in srgb, CanvasText 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#modal[hidden] { display: none; }
.modal { background: var(--bg); color: var(--fg); border-radius: 10px; padding: 14px 16px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin: 0 0 8px; }
.modal .buttons { flex-wrap: wrap; justify-content: flex-end; margin-top: 12px; }
.dev .row { margin: 6px 0; }
pre.state { font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow: auto; }
.goals .goal-main { font-size: 18px; font-weight: 700; margin: 4px 0; }
.goals .goal-list div { margin: 2px 0; }
meter { flex: 1; min-width: 0; height: 10px; }
.item.locked { opacity: 0.6; }
#sheet { position: fixed; inset: 0; background: color-mix(in srgb, CanvasText 40%, transparent); display: flex; align-items: flex-end; z-index: 9; }
#sheet[hidden] { display: none; }
.sheet { background: var(--bg); color: var(--fg); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 14px 14px 0 0; border-top: 4px solid var(--btn); padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet.sell { border-top-color: var(--muted); }
.sheet .sheet-title { font-size: 18px; }
.sheet .seg button { flex: 1; }
.sheet input.qty { text-align: center; font-size: 18px; font-weight: 700; }
button.wide { width: 100%; padding: 12px; margin-top: 8px; }
.item.tap { cursor: pointer; }
.new { font-size: 10px; font-weight: 700; margin-left: 6px; padding: 1px 4px; border-radius: 4px; background: var(--btn); color: var(--btn-fg); }
.article .rubric { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.article h2 { font-size: 22px; line-height: 1.2; margin: 6px 0 10px; }
.article p { margin: 8px 0; }
.dev-tap { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
.dev .row.spread input { flex: 0 0 90px; width: 90px; }
.dev .row.spread input[type="checkbox"] { flex: 0 0 auto; width: 22px; height: 22px; }

</style>
</head>
<body>
<div id="app"><main id="screen"></main><div id="actionbar"></div><nav id="nav"></nav></div>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<script id="mlrd-config" type="application/json">{"cfg":{"meta":{"_comment":"Общие настройки конфига. Правила вида чисел — из сценария v1.3, раздел 4.","configVersion":"1.0.0","scenarioVersion":"1.3","locale":"ru","currency":{"code":"USD","symbolKey":"format.currency","position":"prefix"},"numberFormat":{"_comment":"До fullBelow — число полностью, с разделителем тысяч. Выше — первая подходящая ступень сверху вниз, до двух знаков после запятой. Округление вниз, как в v27. Незначащие нули отбрасываются ($9,3М, $50М). Правило единое для всех ступеней. Примеры проверяются в npm run config:check.","fullBelow":100000,"rounding":"floor","decimalBase":10,"trimTrailingZeros":true,"thousandsGroupSize":3,"percentScale":100,"percentDecimals":1,"minusKey":"format.minus","percentKey":"format.percent","multiplierDecimals":2,"multiplierKey":"format.multiplier","tiers":[{"min":1000000000,"divisor":1000000000,"decimals":2,"suffixKey":"format.suffix.billion"},{"min":1000000,"divisor":1000000,"decimals":2,"suffixKey":"format.suffix.million"},{"min":100000,"divisor":1000,"decimals":2,"suffixKey":"format.suffix.thousand"}],"locales":{"ru":{"decimalSeparator":",","thousandsSeparator":" "}}},"season":{"_comment":"Заготовка на второй релиз.","enabled":false},"dailyLogin":{"_comment":"Заготовка на второй релиз.","enabled":false},"dailyTasks":{"_comment":"Заготовка на второй релиз.","enabled":false}},"progression":{"_comment":"Статусы и эры. Сценарий v1.3, разделы 5 и 10. Статус — по капиталу (capitalFrom — капитал, с которого он начинается). Эра — по задачам эры из eras.json (задача 3.2), порога капитала у эры нет. legacyRange — диапазон уровней v27, legacyLevel — уровень v27, с которого эра берёт значения рынка (правило нижнего уровня, см. market.json).","statuses":[{"id":"novice","nameKey":"status.novice","capitalFrom":0},{"id":"mamkin","nameKey":"status.mamkin","capitalFrom":40000},{"id":"merchant","nameKey":"status.merchant","capitalFrom":100000},{"id":"businessman","nameKey":"status.businessman","capitalFrom":500000},{"id":"millionaire","nameKey":"status.millionaire","capitalFrom":1000000},{"id":"angel","nameKey":"status.angel","capitalFrom":5000000},{"id":"investor","nameKey":"status.investor","capitalFrom":20000000},{"id":"shareholder","nameKey":"status.shareholder","capitalFrom":50000000},{"id":"industrialist","nameKey":"status.industrialist","capitalFrom":150000000},{"id":"capitalist","nameKey":"status.capitalist","capitalFrom":500000000},{"id":"billionaire","nameKey":"status.billionaire","capitalFrom":1000000000}],"eras":[{"id":"era1","nameKey":"era.era1","legacyRange":"L3","legacyLevel":"L3"},{"id":"era2","nameKey":"era.era2","legacyRange":"L5-6","legacyLevel":"L5"},{"id":"era3","nameKey":"era.era3","legacyRange":"L7-8","legacyLevel":"L7"},{"id":"era4","nameKey":"era.era4","legacyRange":"L9+","legacyLevel":"L9+"},{"id":"era5","nameKey":"era.era5","legacyRange":"L9+","legacyLevel":null,"copyOfEra":"era4","_comment":"ВРЕМЕННЫЙ ДУБЛЬ: значения эры V повторяют эру IV (в v27 таблицы кончаются на L9+). Уточнить после теста."}],"statusOnlyIncreases":true,"_statusComment":"Задача 4.1: «Мамкин бизнесмен» — с $40 000 (было $25 000), одновременно с закрытием чек-листа 2."},"market":{"_comment":"Рынок. Механика и числа из v27. Массивы «по эрам» идут в порядке эр из progression.json: [I, II, III, IV, V].","_eraRule":"ПРАВИЛО ЭР: каждая эра берёт значения НИЖНЕГО уровня своего диапазона v27. Эра I ← L3, эра II ← L5, эра III ← L7, эра IV ← L9+, эра V — копия эры IV. Уровень записан в progression.json → eras[].legacyLevel. Исходные таблицы v27 по уровням — в legacyV27 ниже; npm run config:check сверяет с ними priceCaps, sigma и shareLimits.","companies":[{"id":"googol","nameKey":"market.company.googol","risk":"low","riskKey":"market.risk.low"},{"id":"macrosoft","nameKey":"market.company.macrosoft","risk":"medium","riskKey":"market.risk.medium"},{"id":"closedai","nameKey":"market.company.closedai","risk":"high","riskKey":"market.risk.high"}],"priceCaps":{"_comment":"v27 getBaseStockPriceCap(). Эра V = дубль эры IV.","googol":[320,450,700,1000,1000],"macrosoft":[420,700,1200,1800,1800],"closedai":[750,1300,2600,4200,4200]},"sigma":{"_comment":"v27 getSigma(). Волатильность — доля цены за ход. Эра V = дубль эры IV.","googol":[0.02,0.05,0.07,0.09,0.09],"macrosoft":[0.05,0.09,0.12,0.15,0.15],"closedai":[0.15,0.18,0.25,0.3,0.3]},"shareLimits":{"_comment":"v27 getShareLimit(). В v27 внутри L7–8 значения разные (L7: 700/900, L8: 1400/1800). По правилу эр взято L7. Эра V = дубль эры IV.","googol":[400,500,700,1800,1800],"macrosoft":[400,500,700,1800,1800],"closedai":[600,700,900,2400,2400]},"legacyV27":{"_comment":"Исходные значения v27 по уровням — только для проверки правила эр. В игре не используются.","priceCaps":{"L3":{"googol":320,"macrosoft":420,"closedai":750},"L5":{"googol":450,"macrosoft":700,"closedai":1300},"L6":{"googol":450,"macrosoft":700,"closedai":1300},"L7":{"googol":700,"macrosoft":1200,"closedai":2600},"L8":{"googol":700,"macrosoft":1200,"closedai":2600},"L9+":{"googol":1000,"macrosoft":1800,"closedai":4200}},"sigma":{"L3":{"googol":0.02,"macrosoft":0.05,"closedai":0.15},"L5":{"googol":0.05,"macrosoft":0.09,"closedai":0.18},"L6":{"googol":0.05,"macrosoft":0.09,"closedai":0.18},"L7":{"googol":0.07,"macrosoft":0.12,"closedai":0.25},"L8":{"googol":0.07,"macrosoft":0.12,"closedai":0.25},"L9+":{"googol":0.09,"macrosoft":0.15,"closedai":0.3}},"shareLimits":{"L3":{"googol":400,"macrosoft":400,"closedai":600},"L5":{"googol":500,"macrosoft":500,"closedai":700},"L6":{"googol":500,"macrosoft":500,"closedai":700},"L7":{"googol":700,"macrosoft":700,"closedai":900},"L8":{"googol":1400,"macrosoft":1400,"closedai":1800},"L9+":{"googol":1800,"macrosoft":1800,"closedai":2400}}},"trend":{"_comment":"v27 updateMarket(). Раз в несколько ходов тренд компании выбирается заново: с шансом downChance — падающий, иначе растущий. durationTurns — сколько ходов тренд реально держится, равновероятно. Откуда 4…6: в v27 срок задаётся как floor(random(3,6)) = 3…5, но в ход назначения не уменьшается, поэтому наблюдаемая длительность на 1 ход больше — 4…6, в среднем 5 (утверждено в задаче 2.2).","durationTurns":{"min":4,"max":6},"downChance":0.37,"downDrift":{"min":-0.015,"max":-0.002},"upDrift":{"min":0.003,"max":0.025}},"hotSector":{"_comment":"v27 updateHotSector() и getStockPriceCap(). Разогретой компании — бонус к тренду и потолок ×1,3 (округляется до capRoundTo долларов, как Math.round в v27), остальным — штраф. Длительность в v27: floor(random(10,16)) = 10…15.","trendBonus":0.01,"othersPenalty":0.003,"capMultiplier":1.15,"capRoundTo":1,"durationTurns":{"min":6,"max":10},"startTitleKey":"market.hot.startTitle","startSubKey":"market.hot.startSub","rotateTitleKey":"market.hot.rotateTitle","rotateSubKey":"market.hot.rotateSub","feature":"hotSector","softBordersOverHot":false,"_era2Comment":"Задача 4.3: разогрев ослаблен — бонус к тренду 1% (было 1,8%), потолок ×1,15 (было ×1,3), 6–10 ходов (было 10–15). softBordersOverHot — надстраивается ли мягкий бортик (×1,15) над потолком разогрева: false — разогретая цена упирается ровно в потолок разогрева."},"softBorders":{"_comment":"v27 updateMarket() и clampCompanyPrice(). Выше upperRatio от потолка тренд давится вниз на (ratio − upperRatio) × upperCoef, ниже lowerRatio — подпирается вверх на (lowerRatio − ratio) × lowerCoef. Жёсткий срез — на потолке × hardCapMultiplier. До включения срез ровно на потолке. ОСОЗНАННОЕ ОТСТУПЛЕНИЕ ОТ v27 (задача 2.3): в v27 бортики включались с L5, у нас — с эры I, иначе в эре I цена десятки ходов стоит ровно на потолке и игра выглядит сломанной.","upperCoef":0.12,"lowerRatio":0.35,"lowerCoef":0.1,"hardCapMultiplier":1.15,"_upperRatioComment":"Задачи 4.1–4.3: включение бортиков задаёт чек-лист (checklists.json → market.softBorders). Здесь — стандартные числа v27: порог 0,80, коэффициент 0,12, нижний бортик 0,35 / 0,10, жёсткий срез ×1,15 (их берёт эра II). Эра I с чек-листа 3 задаёт свои: порог 0,65 и коэффициент 0,20 (задача 3.3).","upperRatio":0.8},"priceFloor":20,"priceFloorPct":0,"marginCall":{"_comment":"v27 marginCall(): дисконт 10%, долг +5% за ход. Потолок процентов — из v1.3: не больше половины дохода от активов за ход.","_thresholdComment":"Задача 3.3, правка 3: кэш ушёл в минус — тихо открывается кредитная линия (без модалки). Маржин-колл — только если долг больше порога; тогда акции продаются с дисконтом до полного погашения долга. Задача 3.4: порог = большее из двух — доход от активов за thresholdIncomeTurns ходов или thresholdLiquidShare от ликвидных средств (кэш + акции). Так игрок с большим портфелем и малым доходом не получает маржин-колл от одного провала события.","thresholdIncomeTurns":20,"thresholdLiquidShare":0.1,"discount":0.1,"debtRatePerTurn":0.05,"interestCapShareOfAssetIncome":0.5,"sellOrder":"largestPositionFirst","titleKey":"market.marginCall.title","textKey":"market.marginCall.text","creditLineOpenKey":"market.marginCall.creditLineOpen","creditLineClosedKey":"market.marginCall.creditLineClosed"},"fee":0,"positionCapPct":{"_comment":"Заготовка: лимит позиции в % от капитала. Выключен.","enabled":false,"value":null},"_legacyTables":"Задача 4.1: priceCaps, shareLimits и sigma по эрам ядром больше не читаются — их берёт чек-лист. Таблицы сохранены для проектирования эр II–V."},"venture":{"_comment":"Венчур. Раунды и суммы — v1.3, раздел 6. Таблицы множителей — v27 STARTUP_TABLES.","durationTurns":10,"decisionTurns":[3,7],"autoExitTurn":10,"maxActiveStartups":1,"stakeScaleByEra":[1,1,1,1,1],"rounds":[{"id":"preseed","nameKey":"venture.round.preseed","entry":10000,"followOn":3000,"multiplierTable":"normal"},{"id":"seed","nameKey":"venture.round.seed","entry":20000,"followOn":5000,"multiplierTable":"premium"},{"id":"seriesA","nameKey":"venture.round.seriesA","entry":40000,"followOn":10000,"multiplierTable":"mega"},{"id":"seriesB","nameKey":"venture.round.seriesB","entry":100000,"followOn":25000,"multiplierTable":"mega"},{"id":"seriesC","nameKey":"venture.round.se <script>
(function () {
"use strict";
var defs = {
"src\\ui\\main.js": [function (require, module, exports) {
// Точка входа технического билда: конфиг из страницы → ядро → экраны, модалки, сохранение, время.
const { h, mount } = require("./dom");
const { makeTranslator } = require("../shared/translate");
const { createFormatter } = require("../shared/format");
const { createStore } = require("./store");
const { createModal } = require("./modal");
const { createView } = require("./view");
const { createEffects } = require("./effects");
const decisions = require("./decisions");
const { openDev } = require("./dev");
const { createBalance } = require("./balance");
const { initTelegram } = require("./telegram");
const core = require("../core");
const { renderTrade } = require("./screens/trade");
const screens = {
  market: require("./screens/market").marketScreen,
  venture: require("./screens/venture").ventureScreen,
  assets: require("./screens/assets").assetsScreen,
  shop: require("./screens/others").shopScreen,
  rating: require("./screens/others").ratingScreen,
  profile: require("./screens/profile").profileScreen,
};

function boot() {
  const { cfg, texts } = JSON.parse(document.getElementById("mlrd-config").textContent);
  const ui = cfg.ui;
  const t = makeTranslator(texts);
  const app = { cfg, texts, ui, t, fmt: createFormatter(cfg.meta, texts), tab: ui.startTab, trade: { company: null, mode: null, quantity: 0 }, lastDayDelta: null };
  document.title = t(ui.titleKey);
  app.playerName = initTelegram();
  app.store = createStore(cfg, ui);
  app.modal = createModal(document.getElementById("modal"), t);
  app.view = createView(app);
  app.balance = createBalance(app);
  // Отметка NEW: контент открыт чек-листом и ещё не просмотрен. Заход на вкладку гасит её отметки.
  app.newIds = (tab) => {
    const state = app.store.state;
    if (!state) return [];
    const kinds = Object.entries(ui.newMarks.tabs).filter(([, tabId]) => tabId === tab);
    return kinds.flatMap(([kind]) => core.unlocks(cfg, state, kind).filter((id) => !state.seen[kind + id]).map((id) => kind + id));
  };
  app.isNew = (kind, id) => !!app.store.state && core.unlocks(cfg, app.store.state, kind).includes(id) && !app.store.state.seen[kind + id];
  app.markTabSeen = (tab) => {
    const ids = app.newIds(tab);
    if (ids.length) app.store.patchQuiet((s) => ids.forEach((key) => (s.seen[key] = true)));
  };
  const effects = createEffects(app);
  const screenEl = document.getElementById("screen");
  const navEl = document.getElementById("nav");
  const actionEl = document.getElementById("actionbar");

  app.render = () => {
    if (!app.store.state) return;
    // Ручной баланс включён — заметная строка сверху каждого экрана, чтобы не принять его за настоящую игру.
    mount(screenEl, app.balance.modified ? h("div", { class: "card warn" }, t("ui.balance.banner")) : null, screens[app.tab](app));
    renderTrade(app);
    // «Завершить день» — отдельной полосой над меню на главном экране, не перекрывает содержимое.
    mount(actionEl, app.tab === ui.startTab ? h("button", { class: "primary end-day", onClick: () => app.endDay() }, t("ui.endDay")) : null);
    mount(
      navEl,
      ui.tabs.map((tab) =>
        h(
          "button",
          { class: tab.id === app.tab ? "active" : "", onClick: () => { app.tab = tab.id; app.render(); screenEl.scrollTop = 0; } },
          t(tab.labelKey),
          app.newIds(tab.id).length ? h("span", { class: "new" }, t("ui.new")) : null
        )
      )
    );
    // Отметки гасятся после отрисовки: на этом заходе игрок их ещё видит, на следующем — уже нет.
    app.markTabSeen(app.tab);
  };

  app.endDay = () => {

// Детерминированный генератор псевдослучайных чисел (mulberry32).
// Для каждого хода создаётся заново из пары seed + номер хода,
// поэтому любой ход можно пересчитать отдельно, не проигрывая партию с начала.
// Math.random() в ядре не используется нигде.

// Перемешивание seed и номера хода в одно 32-битное число (murmur3 fmix32).
function mixSeed(seed, turn, c) {
  let h = seed ^ Math.imul(turn, c.turnMultiplier);
  h ^= h >>> c.fmixShiftA;
  h = Math.imul(h, c.mixA);
  h ^= h >>> c.fmixShiftB;
  h = Math.imul(h, c.mixB);
  h ^= h >>> c.fmixShiftA;
  return h;
}

function createRng(cfg, seed, turn) {
  const c = cfg.core.rng;
  let a = mixSeed(seed, turn, c);

  // Следующее число в диапазоне [0; 1).
  function next() {
    a = (a + c.increment) | 0;
    let t = Math.imul(a ^ (a >>> c.shiftA), a | c.orA);
    t = (t + Math.imul(t ^ (t >>> c.shiftB), t | c.orB)) ^ t;
    return ((t ^ (t >>> c.shiftC)) >>> 0) / c.divisor;
  }

  return {
    next,
    // Равномерно между min и max.
    uniform(min, max) {
      return min + next() * (max - min);
    },
    // Целое от min до max включительно.
    int(min, max) {
      return min + Math.floor(next() * (max - min + 1));
    },
    // true с вероятностью p.
    chance(p) {
      return next() < p;
    },
    // Случайный элемент списка.
    pick(list) {
      return list[Math.floor(next() * list.length)];
    },
  };
}
